<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mock Emulingo second screen</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0b1322;color:#eee;font:16px Arial}#app{height:100dvh;display:flex;flex-direction:column}header{display:flex;flex-wrap:wrap;gap:4px;padding:6px;background:#182234;flex:none}nav{display:flex;flex:1;min-width:0;flex-wrap:wrap;gap:4px}header button{min-height:36px;border:0;border-radius:4px;padding:6px 8px;background:#2b354a;color:#eee;cursor:pointer}.translation-feed{flex:1;min-height:0;overflow:auto;padding:12px}.translation-item{border:3px solid #3f536b;padding:12px;margin-bottom:12px;cursor:pointer}.translation-regions{display:flex;gap:12px;flex-wrap:wrap;min-width:0}.translation-regions>div{flex:1;min-width:min(150px,100%)}.translation-item p{margin:6px 0;overflow-wrap:anywhere}.text-tr-sm{font-size:14px}.text-tr-lg{font-size:18px}.italic{font-style:italic}.native-vocab{display:flex;gap:4px}.native-vocab button,.translation-actions button{color:#a5b4fc;background:none;border:1px solid #72849c;padding:6px}.region-label{font-size:10px;color:#a8b3c5;text-transform:uppercase}#native-state{margin:0;padding:8px;font-size:12px}.other-view{flex:1;padding:20px}</style></head>
<body><section id="app"><header><nav aria-label="Second screen views"><button id="translations" aria-current="page">Translations</button><button id="flashcards">Flashcards</button><button>Companions</button><button id="native-settings">Settings</button><button disabled>Quest · soon</button></nav><button id="pair">Pair</button></header><p id="native-state" role="status">Mock paired panel</p><div class="translation-feed">
<div id="current" class="translation-item"><div class="translation-regions"><div><span class="region-label">speaker</span><p class="text-tr-sm">妈妈</p><p class="text-tr-lg">Mom</p></div><div><span class="region-label">dialogue</span><p class="text-tr-sm">对了，隔壁的大木博士正在找你呢。</p><p class="text-tr-sm italic">duì le, gé bì de dà mù bó shì zhèng zài zhǎo nǐ ne.</p><p class="text-tr-lg">By the way, Professor Oak next door is looking for you.</p></div></div><p class="text-tr-xs">A mock explanation, not a source line.</p><div class="native-vocab"><button aria-label="Save 博士 to vocab">+ 博士</button></div><div class="translation-actions"><button aria-label="Delete translation">Delete</button></div></div>
<div class="translation-item"><div class="translation-regions"><div><span class="region-label">dialogue</span><p class="text-tr-sm">你好，朋友。</p><p class="text-tr-lg">Hello, friend.</p></div></div><div class="translation-actions"><button aria-label="Delete translation">Delete</button></div></div>
</div></section><script src="/mock-manager.js"></script><script>
const feedTemplate=document.querySelector('.translation-feed').outerHTML;
const state=text=>document.querySelector('#native-state').textContent=text;
document.querySelector('#native-settings').onclick=()=>state('Native Settings opened');
document.querySelector('#pair').onclick=()=>state('Native pairing opened');
document.querySelector('#flashcards').onclick=()=>{document.querySelector('.translation-feed')?.remove();const view=document.createElement('div');view.className='other-view';view.textContent='Mock flashcards';document.querySelector('#app').append(view);};
document.querySelector('#translations').onclick=()=>{document.querySelector('.other-view')?.remove();if(!document.querySelector('.translation-feed'))document.querySelector('#app').insertAdjacentHTML('beforeend',feedTemplate);};
document.addEventListener('click',event=>{const button=event.target.closest('button[aria-label="Delete translation"]');if(button){button.closest('.translation-item').remove();state('Native translation deleted');}});
</script><script src="/emulingo-lexirise.user.js"></script></body></html>
