<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Emulingo Lexirise integration fixture</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1322;color:#eee;font:16px Arial}#app{height:100dvh;display:grid;grid-template-rows:180px 1fr 90px}canvas{background:#2d3c36;width:100%;height:100%}.translation-feed{overflow:auto;padding:12px}.translation-item{padding:12px;border:1px solid #e4b333;background:#172338;margin-bottom:10px;cursor:pointer}.translation-item p{margin:0 0 8px}.text-tr-sm{font-size:14px}.italic{font-style:italic}.text-tr-base,.text-tr-lg{font-weight:600}.translation-actions{display:flex;gap:12px;margin-top:10px}.translation-actions button{background:none;border:0;color:#65baff;font:14px Arial;padding:6px} .native-vocab{display:flex;gap:6px}.native-vocab button{border:1px solid gray;border-radius:20px;background:transparent;color:white}.controls{display:flex;align-items:center;justify-content:center;gap:8px;background:#51469a}.controls button{display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:4px;color:white;background:#ffffff15}.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.empty-space{padding:20px;color:#8390a2}#native-state{font-size:12px;color:#c4cbda}
.desktop-controls{display:none}
@media(min-width:900px){#app{grid-template-columns:minmax(0,1fr) 480px;grid-template-rows:1fr 90px;gap:0}canvas{grid-column:1;grid-row:1}.translation-feed{grid-column:2;grid-row:1 / 3;border-left:1px solid #38465c}.mobile-controls{display:none}.desktop-controls{display:flex;grid-column:1;grid-row:2}.desktop-controls button{width:auto;min-width:44px;padding:0 12px}}
</style></head><body><div id="app"><canvas aria-label="Game canvas"></canvas><div class="translation-feed">
<div class="translation-item"><p class="truncate text-tr-sm">It was said on TV that every boy has a day when he leaves home.</p></div>
<div class="translation-item" id="current"><div class="translation-regions"><div><p class="text-tr-sm">对了，隔壁的大木博士正在找你呢。</p><p class="text-tr-sm italic">duì le, gé bì de dà mù bó shì zhèng zài zhǎo nǐ ne.</p><p class="text-tr-lg">By the way, Professor Oak next door is looking for you.</p></div></div><p class="text-tr-xs" id="native-grammar">A mock grammar explanation.</p><div class="native-vocab"><button aria-label="Save 隔壁 to vocab">+ 隔壁</button><button aria-label="Save 博士 to vocab">+ 博士</button></div><div class="translation-actions"><button aria-label="Play pronunciation">▷ Play</button><span>Was this accurate?</span><button aria-label="Translation was accurate">Yes</button><button aria-label="Translation was inaccurate">No</button></div></div>
<div class="empty-space">Tap here to close the lookup.</div><p id="native-state">Native actions: 0</p>
</div><div class="controls mobile-controls"><button aria-label="Save game">Save</button><button aria-label="Game sound">♫</button><button aria-label="Game speed">1×</button><button aria-label="Open settings">☷</button><button aria-label="Add fixture translation" id="add">＋</button><button aria-label="Replace fixture Mandarin" id="replace">↻</button></div><div class="controls desktop-controls" role="group" aria-label="Game controls"><button aria-label="Save game">Save</button><button aria-label="Game sound">Sound</button><button aria-label="Game speed">1×</button><button aria-label="Open settings">Menu</button><button aria-label="Add fixture translation" id="desktop-add">Add translation</button><button aria-label="Replace fixture Mandarin" id="desktop-replace">Replace Mandarin</button></div></div>
<script src="/mock-manager.js"></script><script src="/emulingo-lexirise.user.js"></script><script>
let clicks=0;document.querySelector('.translation-actions').onclick=()=>{document.getElementById('native-state').textContent='Native actions: '+(++clicks)};
document.getElementById('add').onclick=()=>{const div=document.createElement('div');div.className='translation-item';div.innerHTML='<div class="translation-regions"><div><p class="text-tr-sm">你好，朋友。</p><p class="text-tr-sm italic">nǐ hǎo, péng you.</p><p class="text-tr-lg">Hello, friend.</p></div></div><p class="text-tr-xs">A newly added explanation.</p>';document.querySelector('.empty-space').before(div);};
document.getElementById('replace').onclick=()=>{const source=document.querySelector('#current p.text-tr-sm:not(.italic)');source.textContent=source.textContent==='你好，朋友。'?'对了，隔壁的大木博士正在找你呢。':'你好，朋友。';};
document.getElementById('desktop-add').onclick=()=>document.getElementById('add').click();
document.getElementById('desktop-replace').onclick=()=>document.getElementById('replace').click();
</script></body></html>
